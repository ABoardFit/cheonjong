<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>천종지자 · 남궁 동작 비교</title><link rel="stylesheet" href="styles.css?v=960fd53ba2"><link rel="stylesheet" href="dojo.css?v=cca98761d8"><link rel="stylesheet" href="namgung.css?v=6625c0f5a7"></head>
<body class="in-dojo"><main id="dojo-screen" aria-labelledby="namgung-title">
<canvas id="namgung-canvas" width="1100" height="680" aria-label="선택한 단계의 캐릭터 동작과 남궁 무공을 반복 재생하는 연무장"></canvas>
<header class="dojo-header namgung-header"><a class="namgung-back" href="index.html">← 메인으로</a><div><p>演武場 · 南宮</p><h1 id="namgung-title">동작 비교</h1><small>연출 비교 · 실제 전투와 별도</small></div><button id="pause" type="button" aria-pressed="false">일시정지</button></header>
<aside class="dojo-note" aria-live="polite"><span id="detail-type">初式 · 1단계</span><h2 id="form-name">일검청천</h2><p id="form-description"></p></aside>
<footer class="dojo-controls">
<div class="dojo-categories" id="path-tabs" role="group" aria-label="무공 갈래"><button type="button" data-path="sword" aria-pressed="true">검법 <small>창궁무애검법</small></button><button type="button" data-path="formation" aria-pressed="false">검형 <small>제왕검형</small></button><button type="button" data-path="dash" aria-pressed="false">경공 <small>무한보</small></button></div>
<div class="dojo-rank-row"><span>강화 단계</span><div class="dojo-ranks" id="rank-buttons" role="group" aria-label="강화 단계 선택"></div></div>
<div class="dojo-partner-row"><button id="mind-focus" type="button" aria-pressed="false" aria-label="짝 심법 설명 보기"><span id="mind-name">창궁대연신공</span></button><div class="dojo-partner-levels" id="mind-buttons" role="group" aria-label="짝 심법 단계 선택"></div></div>
<div class="dojo-directions" role="group" aria-label="공격 방향 선택"><span>공격 방향</span><div id="direction-pad" class="namgung-direction-buttons"></div></div>
<div class="dojo-secondary"><button id="walking" type="button" aria-pressed="false">걷기 켜기</button><button id="replay" type="button">처음부터 재생 ↺</button><button id="step" type="button">한 프레임 진행</button><output id="time-readout" aria-label="재생 시간">0.00초</output><p><kbd>1–7</kbd> 단계 변경 <span>·</span> <kbd>Space</kbd> 재생/정지 <span>·</span> <kbd>Esc</kbd> 메인</p></div>
<details class="namgung-options"><summary>연무 설정</summary><div class="namgung-options-row"><label><input id="targets" type="checkbox" checked> 연무 표적</label><label><input id="range" type="checkbox"> 범위 표시</label><label class="namgung-timeline">재생 위치 <input id="timeline" type="range" min="0" max="7" step="0.01" value="0" aria-label="애니메이션 재생 위치"></label></div><p id="fusion-note">초식 6단계 + 짝 심법 6성에서 절세무공 완성</p><p id="mechanic-note"></p><div id="qi-demo" hidden><div class="namgung-options-row"><span>호신 검기 <output id="qi-count">0 / 1</output></span><button id="qi-pickup" type="button">검기 획득</button><button id="qi-hit" type="button">피격</button></div><p id="qi-note"></p></div></details>
</footer><div hidden><span id="stage-title"></span><span id="stage-rank"></span><span id="stage-mind"></span><span id="rank-caption"></span><span id="direction-caption"></span></div>
